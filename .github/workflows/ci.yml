# Runs on every push and pull request. Nothing here needs an API key: the
# Python suite stubs the model, the retrieval eval is offline, and the
# frontend tests run in jsdom. The browser smoke test (frontend/e2e) spends
# quota and needs a running server, so it is deliberately NOT in CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Unit tests (no network, no API key)
        run: pytest -q
      - name: Memory floor (import cost only; ingest is stubbed)
        run: python eval/memory_probe.py --pages=50 | tail -20

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build the deployment image
        run: docker build -t paperlens .
      - name: Boot it and hit /api/health
        run: |
          docker run -d --name pl -p 7860:7860 \
            -e SECRET_KEY=ci-only-not-secret-0123456789abcdef -e GEMINI_API_KEY=unused paperlens
          for i in $(seq 1 30); do
            if curl -sf http://localhost:7860/api/health; then echo; exit 0; fi
            sleep 1
          done
          docker logs pl; exit 1
